<path d="M130 16 C 70 16 44 58 44 108 C 44 150 56 176 80 190 L 112 196 L 148 196 L 180 190 C 204 176 216 150 216 108 C 216 58 190 16 130 16 Z" fill="url(#hd)" stroke="#2f7fe6" stroke-width="1.8"/>
