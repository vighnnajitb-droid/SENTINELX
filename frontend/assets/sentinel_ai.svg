<rect x="30" y="94" width="22" height="46" rx="9" fill="#0a1a3a" stroke="#1d6fe0" stroke-width="1.5"/>
<rect x="208" y="94" width="22" height="46" rx="9" fill="#0a1a3a" stroke="#1d6fe0" stroke-width="1.5"/>
<rect x="36" y="106" width="9" height="22" rx="4" fill="#00A8FF" opacity=".9" filter="url(#gs)"/>
<rect x="215" y="106" width="9" height="22" rx="4" fill="#00A8FF" opacity=".9" filter="url(#gs)"/>
