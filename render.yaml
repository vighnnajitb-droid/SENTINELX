services:
  - type: web
    name: sentinelx-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python seed_db.py && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelx-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: sentinelx-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_URL
        value: https://sentinelx-backend.onrender.com/api/v1

databases:
  - name: sentinelx-db
    plan: free
    databaseName: sentinelx
    user: sentinelx_user
