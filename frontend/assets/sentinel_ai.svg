<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300">
<defs>
<linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a4a86"/><stop offset=".35" stop-color="#0d1f45"/><stop offset="1" stop-color="#040b1c"/></linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa8ff" stop-opacity=".75"/><stop offset="1" stop-color="#5fa8ff" stop-opacity="0"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16305f"/><stop offset="1" stop-color="#050c1e"/></linearGradient>
<radialGradient id="vs" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#bff4ff"/><stop offset=".5" stop-color="#19b7ff"/><stop offset="1" stop-color="#0a5fd8"/></radialGradient>
<filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="gs" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<ellipse cx="130" cy="140" rx="120" ry="130" fill="#087BFF" opacity=".10" filter="url(#gl)"/>
